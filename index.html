<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">☀️</span>
          <h1>Weather Dashboard</h1>
        </div>

        <form id="searchForm" class="search-form">
          <input
            id="cityInput"
            type="text"
            placeholder="Search city..."
            aria-label="Search city"
            value="London"
          />
          <button type="submit">Search</button>
        </form>
      </header>

      <main class="dashboard">
        <section class="hero card">
          <div class="hero-main">
            <div>
              <p id="locationLabel" class="eyebrow">Loading...</p>
              <h2 id="currentTemp">--°C</h2>
            </div>

            <div class="weather-icon-wrap">
              <div id="weatherIcon" class="weather-icon">🌤️</div>
            </div>
          </div>

          <div class="hero-meta">
            <div>
              <span>Feels like</span>
              <strong id="feelsLike">--°C</strong>
            </div>
            <div>
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div>
              <span>Wind</span>
              <strong id="wind">-- km/h</strong>
            </div>
          </div>
        </section>

        <section class="stats-grid">
          <article class="card stat">
            <span>Sunrise</span>
            <strong id="sunrise">--:--</strong>
          </article>
          <article class="card stat">
            <span>Sunset</span>
            <strong id="sunset">--:--</strong>
          </article>
          <article class="card stat">
            <span>Pressure</span>
            <strong id="pressure">-- hPa</strong>
          </article>
          <article class="card stat">
            <span>Condition</span>
            <strong id="condition">--</strong>
          </article>
        </section>

        <section class="card forecast-section">
          <div class="section-header">
            <h3>7-Day Forecast</h3>
          </div>
          <div id="forecast" class="forecast"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
